[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["config", "config.*", "tests", "tests.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
