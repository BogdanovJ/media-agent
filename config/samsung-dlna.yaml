# Conservative profile: large-file compatibility is NOT yet established.
output_root: /mnt/downloads/media-agent-ready
quarantine_root: /mnt/downloads/deleted
download_root: /mnt/downloads
state_db: /var/lib/media-agent/journal.sqlite3
poll_seconds: 60
cleanup_days: 7
# Processing and retention cleanup enabled for the reviewed rollout.
process_enabled: true
cleanup_enabled: true
# Retirement still requires explicit torrent hash approvals.
finalize_enabled: true
ffmpeg_threads: 2
# Files larger than this are flagged, not automatically split/transcoded.
review_over_bytes: 4294967296
min_free_bytes: 10737418240

retirement_allow_hashes: []
metrics_enabled: true
metrics_host: 127.0.0.1
metrics_port: 9108
